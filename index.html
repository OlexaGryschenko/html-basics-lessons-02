<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Моя перша сторінка</title>
</head>
<body>

  <!-- Текстові теги та форматування (Урок 002) -->
  <h1>Головний заголовок сторінки</h1>
  <h2>Про мене</h2>
  <p>Привіт! Я вивчаю HTML. Це <strong>важливий текст</strong> та <em>виділений текст</em>.</p>

  <!-- Навігація та медіа (Урок 003) -->
  <h2>Корисні посилання та зображення</h2>
  <p>
    Перейти на <a href="https://www.google.com" target="_blank">Google</a>
  </p>
  <img src="https://via.placeholder.com/150" alt="Приклад картинки" width="150">

  <!-- Списки (Урок 004) -->
  <h2>Мої хобі</h2>
  <ul>
    <li>Програмування</li>
    <li>Ігри</li>
    <li>Спорт</li>
  </ul>

  <!-- Таблиці (Урок 005) -->
  <h2>Простий розклад</h2>
  <table border="1">
    <tr>
      <th>День</th>
      <th>Предмет</th>
    </tr>
    <tr>
      <td>Понеділок</td>
      <td>Інформатика</td>
    </tr>
    <tr>
      <td>Вівторок</td>
      <td>Математика</td>
    </tr>
  </table>

  <!-- Форми (Урок 006) -->
  <h2>Форма зв'язку</h2>
  <form>
    <label for="name">Ваше ім'я:</label><br>
    <input type="text" id="name" name="name"><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email"><br><br>

    <label for="phone">Номер телефону:</label><br>
    <input type="tel" id="phone" name="phone" placeholder="+380XXXXXXXXX"><br><br>

    <button type="submit">Надіслати</button>
  </form>

</body>
</html>
